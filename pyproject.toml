[project]
name = "geap-tour"
version = "0.1.0"
description = "GEAP Workshop: Multi-agent systems with ADK, MCP, evaluation, and observability on Google Cloud"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-aiplatform[adk,agent-engines,evaluation]>=1.163.0",
    "google-genai>=2",
    "fastmcp>=3.4.7",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "google-cloud-monitoring>=2.31.0",
    "google-cloud-bigquery>=3.43.0",
    "litellm>=1.85.7",
    "pandas>=3.0.5",
    "a2a-sdk>=1",
    "google-adk[agent-identity,eval]>=2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.42.1",
    "matplotlib>=3.11.1",
    "paperbanana>=0.3.0",
    "google-cloud-monitoring-dashboards>=2.22.0",
    "opentelemetry-instrumentation-google-genai>=0.7b1",
    "opentelemetry-instrumentation-grpc>=0.63b1",
    "opentelemetry-instrumentation-httpx>=0.63b1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.2",
    "ty>=0.0.70",
]
doe = [
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "pydoe3>=1.6.2",
]
pipelines = [
    "kfp>=2.17.0",
]
