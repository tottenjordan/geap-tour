[project]
name = "geap-tour"
version = "0.1.0"
description = "GEAP Workshop: Multi-agent systems with ADK, MCP, evaluation, and observability on Google Cloud"
requires-python = ">=3.12"
dependencies = [
    "google-cloud-aiplatform[adk,agent-engines,evaluation]>=1.153.1",
    "google-genai>=2",
    "fastmcp>=2.0.0",
    "pydantic>=2.12.5",
    "python-dotenv>=1.0.0",
    "google-cloud-monitoring>=2.16.0",
    "google-cloud-bigquery>=3.40.1",
    "litellm>=1.83.14",
    "pandas>=3.0.1",
    "a2a-sdk>=1",
    "google-adk[agent-identity,eval]>=2",
    "opentelemetry-exporter-otlp-proto-grpc>=1.40.0",
    "matplotlib>=3.10.9",
    "paperbanana>=0.1.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "PIE", "RUF"]
ignore = ["E501"]

[tool.ty.environment]
python-version = "3.12"

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "ruff>=0.16.1",
    "ty>=0.0.66",
]
pipelines = [
    "kfp>=2.7",
]
