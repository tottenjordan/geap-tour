name: Tests

# Fast, cloud-free test suite. Runs the full offline pytest suite (validates
# agent configuration and KFP pipeline compilation without live GCP or MCP
# connections — env defaults come from tests/conftest.py). This is the check
# that gates PRs; the cloud-based eval pipeline runs separately and manually
# (submitted via src.pipelines.submit / the eval_vertex.yaml workflow).

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Supersede in-flight runs for the SAME pull request — pushing three commits to a
# PR otherwise runs three full suites and you wait on the stale ones. Deliberately
# NOT cancel-in-progress on `main`: that run is the record that main is green, and
# cancelling it because another merge landed would leave a commit unverified.
concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    # Observed: median 84s, max 108s over the last 12 green runs. The GitHub
    # default is 360 MINUTES, so a hung test would hold a runner for six hours
    # before anyone learned anything. 10 is ~5x the worst observed run.
    timeout-minutes: 10
    # Least privilege, and the only workflow here that was missing it: this job
    # reads the repo and needs nothing else.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        # `pipelines` + `doe` are NOT optional here: tests/conftest.py drops 39
        # tests when pyDOE3/kfp are missing, and since 2026-09-17 a partial
        # collection is a hard error in CI rather than a smaller green run.
        run: uv sync --group dev --group pipelines --group doe

      - name: Run tests
        # `--no-sync`: the step above already resolved the environment, and letting
        # `uv run` re-resolve invites it to install a DIFFERENT set than the one
        # just verified. Matches the documented local command.
        #
        # `--dist loadfile` is required, not decorative: ~10 modules reload
        # src.config / src.registry and mutate module-level state, so a module's
        # tests must stay on one worker. Per-test distribution would split them.
        run: uv run --no-sync pytest -n auto --dist loadfile
