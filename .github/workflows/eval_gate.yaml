name: Eval Gate

# Opt-in, ADVISORY CI quality gate for the coordinator agent.
#
# What it does, on demand, all reported to the job summary:
#   1. verifies the deployed engine's SERVING CONFIG against the baseline
#      (src.deploy.verify_engine_config) — first, because a misconfigured engine
#      (e.g. a 4Gi container dropping turns) makes every score below meaningless;
#   2. scores the coordinator on rubric metrics via the Vertex Gen AI Evaluation
#      Service, 1-5 with a < 3.0 threshold (src.eval.multi_agent_batch_eval,
#      --limit keeps a run ~3-5 min);
#   3. runs two smoke checks the single-turn rubric path cannot see — multi-turn
#      (simulated_eval) and empty-at-200 (online_monitor --dry-run).
#
# Opt-in, so it never slows an unrelated PR:
#   - runs only when a PR carries the `run-eval` label, or via manual dispatch;
#   - path-filtered to the code that can move quality (agents / MCP / eval);
#   - skips cleanly (no failure) when WIF isn't configured (forks / unset repos).
#
# ADVISORY by design: this workflow is intentionally NOT added to branch-protection
# required checks, so a failing score shows a red mark as a *signal* but does not
# block merge. To make it blocking later: add it to required checks (and/or drop
# the label gate).
#
# HONEST LIMITATION: rubric scoring needs a *deployed* engine, so this gate scores
# the already-deployed shared engine (vars.AGENT_ENGINE_ID) — NOT the PR's
# uncommitted code. It is a quality-regression alarm + capability demo, not a
# strict per-diff gate. Per-diff gating would need a temp deploy per PR (see
# src.pipelines.submit --agent-module, ~15-25 min) or a future local-inference path.

on:
  pull_request:
    types: [labeled, synchronize]
    paths:
      - 'src/agents/**'
      - 'src/mcp_servers/**'
      - 'src/eval/**'
      - '.github/workflows/eval_gate.yaml'
  workflow_dispatch:
    inputs:
      threshold:
        description: 'Minimum passing rubric score (1-5)'
        required: false
        default: '3.0'

concurrency:
  group: eval-gate-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Coordinator rubric eval (advisory)
    # Opt-in AND credentialed: manual dispatch always qualifies; a PR must carry
    # the `run-eval` label. Skips (never fails) when WIF isn't configured.
    if: >-
      ${{ vars.WIF_PROVIDER != '' &&
      (github.event_name == 'workflow_dispatch' ||
      contains(github.event.pull_request.labels.*.name, 'run-eval')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        uses: astral-sh/setup-uv@v4

      - name: Install dependencies
        run: uv sync --group dev --group pipelines

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      # Runs BEFORE the rubric eval: a misconfigured engine makes the scores below
      # meaningless, and this is the cheap way to know. It is a control-plane GET —
      # seconds, no inference cost. Advisory like the rest of this workflow.
      - name: Verify deployed engine config
        id: engine_config
        continue-on-error: true
        run: |
          uv run python -m src.deploy.verify_engine_config \
            --engine-id "${{ vars.AGENT_ENGINE_ID }}" --role coordinator \
            --json > engine_config.json
          cat engine_config.json

      - name: Publish engine config to job summary
        if: always()
        run: |
          uv run python - <<'PY'
          import json, os, pathlib

          path = pathlib.Path("engine_config.json")
          lines = ["# Deployed Engine Config (advisory)", ""]
          if not path.exists():
              lines.append("Config verification produced no output — see the step logs.")
          else:
              results = json.loads(path.read_text())
              for res in results:
                  if res.get("error"):
                      lines.append(f"`{res['engine_id']}` UNREACHABLE: {res['error']}")
                      continue
                  bad = [f for f in res.get("findings", []) if not f["ok"]]
                  crit = [f for f in bad if f["severity"] == "critical"]
                  status = "✅ PASS" if not crit else "❌ FAIL"
                  lines += [f"**{status}** `{res['engine_id']}` "
                            f"({len(crit)} critical, {len(bad) - len(crit)} advisory)", ""]
                  if bad:
                      lines += ["| Check | Severity | Expected | Observed |", "|---|---|---|---|"]
                      lines += [f"| {f['name']} | {f['severity']} | {f['expected']} | "
                                f"{f['observed']} |" for f in bad]
                      lines.append("")
              lines.append("_Critical drift means the engine is serving wrong "
                           "(e.g. a 4Gi container dropping turns) — the rubric scores "
                           "below are suspect until it is fixed._")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as fh:
              fh.write("\n".join(lines) + "\n\n")
          print("\n".join(lines))
          PY

      - name: Run coordinator rubric eval
        env:
          THRESHOLD: ${{ inputs.threshold || '3.0' }}
        run: |
          uv run python -m src.eval.multi_agent_batch_eval \
            --agents coordinator_agent \
            --agent-id "${{ vars.AGENT_ENGINE_ID }}" \
            --threshold "${THRESHOLD}" \
            --limit 8 \
            --output eval_gate_result.json

      # Two smoke checks the rubric gate above cannot see (roadmap P2.9):
      #   * multi-turn — the rubric eval is single-turn, so a regression that only
      #     shows up across turns (context loss, repeated tool calls) is invisible.
      #   * empty-at-200 — a zero-character HTTP 200 is an INFRA failure that the
      #     rubric path can score as merely low quality.
      # Deliberately small and advisory; both are billable, so keep the counts low.
      - name: Multi-turn smoke (advisory)
        id: multiturn
        continue-on-error: true
        run: |
          uv run python -m src.eval.simulated_eval \
            --agent-id "${{ vars.AGENT_ENGINE_ID }}" \
            --agent-name coordinator_agent \
            --scenario-count 2 --max-turns 3 --threshold 3.0

      - name: Empty-stream / online-quality smoke (advisory)
        id: online_smoke
        continue-on-error: true
        run: |
          uv run python -m src.eval.online_monitor \
            --agent-id "${{ vars.AGENT_ENGINE_ID }}" \
            --samples 4 --dry-run

      - name: Publish smoke results to job summary
        if: always()
        run: |
          {
            echo "# Smoke checks (advisory)"
            echo ""
            echo "| Check | Result | Catches |"
            echo "|---|---|---|"
            echo "| multi-turn (simulated_eval) | ${{ steps.multiturn.outcome }} | context loss across turns |"
            echo "| online quality (dry-run) | ${{ steps.online_smoke.outcome }} | empty-at-200 infra failures |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish score to job summary
        if: always()
        run: |
          uv run python - <<'PY'
          import json, os, pathlib

          path = pathlib.Path("eval_gate_result.json")
          # Append, never overwrite — the engine-config step wrote its section first.
          out = os.environ["GITHUB_STEP_SUMMARY"]
          lines = ["# Coordinator Eval Gate (advisory)", ""]
          if not path.exists():
              lines += ["Eval did not produce a result file (auth/inference error) — "
                        "see the step logs above."]
          else:
              data = json.loads(path.read_text())
              overall = "PASS" if data.get("all_passed") else "FAIL"
              lines += [f"**Overall: {overall}**  (threshold {data.get('score_threshold')})",
                        f"Engine: `{data.get('agent_engine')}`", ""]
              agent = data.get("agents", {}).get("coordinator_agent", {})
              metrics = agent.get("metrics", {})
              if metrics:
                  lines += ["| Metric | Score | Threshold | Result |",
                            "|---|---|---|---|"]
                  for name, d in sorted(metrics.items()):
                      mark = "✅" if d.get("passed") else "❌"
                      lines.append(
                          f"| {name} | {d.get('score'):.2f} | "
                          f"{d.get('threshold'):.2f} | {mark} |"
                      )
              else:
                  lines.append(f"No metrics returned (status: {agent.get('status')}).")
              lines += ["",
                        "_Advisory gate: scores the deployed engine, not this PR's "
                        "code. Not a required check._"]
          with open(out, "a") as fh:
              fh.write("\n".join(lines) + "\n")
          print("\n".join(lines))
          PY
